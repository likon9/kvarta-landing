services:
  db:
    image: postgres:16-alpine
    container_name: kvarta-db
    environment:
      POSTGRES_DB: kvarta
      POSTGRES_USER: kvarta
      POSTGRES_PASSWORD: kvarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvarta -d kvarta"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: